  # ── Sachet lending (leadorderinfo / loanoffers) ───────────────────────────

  - question: "How many loan leads were created last month?"
    tables: [leadorderinfo]
    sql: >
      SELECT count(*) AS lead_count
      FROM sachet.leadorderinfo
      WHERE toStartOfMonth(createdat) = toStartOfMonth(now() - INTERVAL 1 MONTH)

  - question: "Loan lead funnel — how many leads at each stage?"
    tables: [leadorderinfo]
    sql: >
      SELECT leadstage, count(*) AS lead_count
      FROM sachet.leadorderinfo
      GROUP BY leadstage
      ORDER BY lead_count DESC

  - question: "Which lender has the most loan leads?"
    tables: [leadorderinfo]
    sql: >
      SELECT provider, count(*) AS lead_count
      FROM sachet.leadorderinfo
      GROUP BY provider
      ORDER BY lead_count DESC

  - question: "What is the lead quality breakdown for personal loans?"
    tables: [leadorderinfo]
    sql: >
      SELECT leadquality, count(*) AS lead_count
      FROM sachet.leadorderinfo
      WHERE productcode = 'personal-loan'
      GROUP BY leadquality
      ORDER BY lead_count DESC

  - question: "Top 5 partners by number of loan leads"
    tables: [leadorderinfo]
    sql: >
      SELECT partnername, count(*) AS lead_count
      FROM sachet.leadorderinfo
      GROUP BY partnername
      ORDER BY lead_count DESC
      LIMIT 5

  - question: "What is the conversion rate from quote to payment stage?"
    tables: [leadorderinfo]
    sql: >
      SELECT
        countIf(leadstage = 'quote') AS quote_leads,
        countIf(leadstage = 'payment') AS payment_leads,
        round(100.0 * countIf(leadstage = 'payment') / nullIf(countIf(leadstage = 'quote'), 0), 2) AS conversion_pct
      FROM sachet.leadorderinfo

  - question: "Show loan offers comparison — ROI and EMI by lender"
    tables: [loanoffers]
    sql: >
      SELECT offer_provider,
             round(avg(offer_roi), 2) AS avg_roi,
             round(avg(offer_emi), 2) AS avg_emi,
             round(avg(offer_loanamount), 0) AS avg_loan_amount,
             count(*) AS offer_count
      FROM sachet.loanoffers
      WHERE offer_status = 'success'
      GROUP BY offer_provider
      ORDER BY avg_roi ASC

  - question: "Which lenders have the highest rejection rate?"
    tables: [loanoffers]
    sql: >
      SELECT offer_provider,
             count(*) AS total_offers,
             countIf(offer_status = 'reject') AS rejected,
             round(100.0 * countIf(offer_status = 'reject') / count(*), 2) AS rejection_pct
      FROM sachet.loanoffers
      GROUP BY offer_provider
      ORDER BY rejection_pct DESC

  - question: "Average credit score of loan applicants"
    tables: [leadorderinfo]
    sql: >
      SELECT round(avg(toFloat64OrNull(leadcustomerinfo_creditscore)), 0) AS avg_credit_score,
             count(*) AS total_leads,
             countIf(leadcustomerinfo_creditscoreavailable = 'True') AS credit_score_available
      FROM sachet.leadorderinfo
      WHERE leadcustomerinfo_creditscore != 'NA'
        AND leadcustomerinfo_creditscore != '0'

  - question: "Loan leads by employment type"
    tables: [leadorderinfo]
    sql: >
      SELECT leadcustomerinfo_employmenttype, count(*) AS lead_count
      FROM sachet.leadorderinfo
      GROUP BY leadcustomerinfo_employmenttype
      ORDER BY lead_count DESC

