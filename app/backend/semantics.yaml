# Turtlemint Semantic Layer
# Replaces the RAG vector index entirely — zero embeddings, zero numpy.
# Keyword matching routes questions to the right tables + injects business
# term definitions and example SQL directly into the generator prompt.
#
# To extend: add a metric/dimension/term block and restart. No reindexing.

metrics:

  - name: partner_signups
    label: "Partner Signups"
    description: "Number of partners who registered / signed up in a time period"
    tables: [partner]
    keywords: [partner, signed up, registered, onboarded, joined, new partner]

  - name: total_premium
    label: "Total Premium"
    description: "Sum of policy premiums, optionally broken down by product type or state"
    tables: [policy]
    keywords: [premium, total premium, revenue, insurance revenue]

  - name: policies_sold
    label: "Policies Sold"
    description: "Count of policies issued, optionally by partner or product"
    tables: [policy, partner]
    keywords: [policies, policy count, policies sold, issued, number of policies]

  - name: top_partners
    label: "Top Partners by Sales"
    description: "Partners ranked by number of policies sold or premium generated"
    tables: [partner, policy]
    keywords: [top partners, best partners, partner ranking, partner performance, leading partners]

  - name: claims_overview
    label: "Claims Overview"
    description: "Count or breakdown of claims by status (Pending, Settled, Rejected)"
    tables: [claim]
    keywords: [claims, pending claims, settled claims, claim status, claims filed]

  - name: commission_summary
    label: "Commission Summary"
    description: "Average or total commission earned per partner or partner tier"
    tables: [commission, partner]
    keywords: [commission, earnings, payout, commission per, agent earnings]

  - name: health_premium_by_state
    label: "Health Premium by State"
    description: "Total health insurance premium grouped by customer state"
    tables: [policydetail]
    keywords: [health premium, state, health by state, geography, region]

  - name: policy_lapse
    label: "Lapsed Policies"
    description: "Policies that have lapsed (expired without renewal)"
    tables: [policy]
    keywords: [lapsed, expired, lapse, policy lapse, not renewed]

  - name: customer_demographics
    label: "Customer Demographics"
    description: "Customer breakdown by state, age, or gender"
    tables: [policydetail]
    keywords: [customer, demographics, age, gender, location, state, customers]

  - name: client_lookup
    label: "Client / Partner / Person Lookup"
    description: "Look up any person by name. IMPORTANT — names are stored in multiple columns: (1) Partner/agent/DP/intermediary full name → salesdetail_intermediaryname (single field, e.g. 'mahjabin khatun'). (2) Customer/proposer → proposer_fname + proposer_lname (split fields). (3) Area Manager → salesdetail_am. (4) RM → salesdetail_rm. Always search salesdetail_intermediaryname first for partner queries, and BOTH proposer fields for customer queries."
    tables: [policydetail]
    keywords: [client, insured, proposer, policy holder, policyholder, person, individual, name, customer name, client name, give details, details of, partner name, agent name, intermediary]

  # ── Real Turtlemint policydetail metrics (spectrum.policydetail) ──────────

  - name: policies_by_insurer
    label: "Policies by Insurer"
    description: "Count or premium breakdown by insurance company (ICICIPRULI, HDFCLI, etc.)"
    tables: [policydetail]
    keywords: [insurer, insurance company, icici, hdfc, sbi, max, bajaj, policies by insurer]

  - name: policies_by_vertical
    label: "Policies by Vertical"
    description: "Count or premium by business vertical: LIFE, MOTOR, HEALTH, TRAVEL"
    tables: [policydetail]
    keywords: [vertical, life, motor, health, travel, product category, productcategory]

  - name: gross_premium
    label: "Gross Premium"
    description: "Total gross premium collected across policies"
    tables: [policydetail]
    keywords: [gross premium, premium collected, total premium, gwp, written premium]

  - name: net_premium
    label: "Net Premium"
    description: "Total net premium (excluding GST/service tax)"
    tables: [policydetail]
    keywords: [net premium, annualised premium, annualized premium]

  - name: policies_by_region
    label: "Policies by Region"
    description: "Count or premium breakdown by sales region: East, West, North, South"
    tables: [policydetail]
    keywords: [region, east, west, north, south, zone, geography, regional]

  - name: policies_by_branch
    label: "Policies by Branch"
    description: "Count or premium breakdown by branch location city"
    tables: [policydetail]
    keywords: [branch, branch location, city, pibranchlocation, office]

  - name: partner_policy_sales
    label: "Partner Policy Sales"
    description: "Policies sold by a specific partner/intermediary, by DP number or name"
    tables: [policydetail]
    keywords: [partner, intermediary, dp number, agent, sold by, salesdetail]

  - name: lapsed_policies_real
    label: "Lapsed Policies (Real Data)"
    description: "Policies with status LAPSED or substatus LAPSED in the real policydetail table"
    tables: [policydetail]
    keywords: [lapsed, lapse, in force, substatus, policy lapsed]

  - name: new_vs_renewal
    label: "New vs Renewal Business"
    description: "Split of new business vs renewal policies"
    tables: [policydetail]
    keywords: [new business, renewal, businesstype, new vs renewal]

  - name: payment_status_breakdown
    label: "Payment Status Breakdown"
    description: "Policies by payment status: Completed, Pending, Overdue"
    tables: [policydetail]
    keywords: [payment status, paid, overdue, completed, pending payment, instalment]

  - name: sum_assured_by_category
    label: "Sum Assured by Category"
    description: "Total sum insured / sum assured grouped by product category or plan type"
    tables: [policydetail]
    keywords: [sum assured, sum insured, coverage, policyrisk, cover amount]

  - name: sales_hierarchy
    label: "Sales Hierarchy Performance"
    description: "Policies or premium grouped by AM, RM, SM, or National Head"
    tables: [policydetail]
    keywords: [am, rm, sm, area manager, relationship manager, sales manager, national head, hierarchy]

  # ── Sachet lending platform metrics ──────────────────────────────────────

  - name: loan_lead_funnel
    label: "Loan Lead Funnel"
    description: "Count of loan leads broken down by funnel stage: quote, credit-stage, proposal, payment, issuance, closed"
    tables: [leadorderinfo]
    keywords: [loan, loan lead, loan funnel, lead stage, personal loan, personal-loan, sachet, lending, funnel, stages]

  - name: loan_lead_volume
    label: "Loan Lead Volume"
    description: "Total number of loan leads created, optionally by date or partner"
    tables: [leadorderinfo]
    keywords: [loan leads, loan count, how many loans, loan volume, lead count, loan applications]

  - name: loan_lead_quality
    label: "Loan Lead Quality"
    description: "Breakdown of loan leads by quality: GOOD, BAD, MEDIUM"
    tables: [leadorderinfo]
    keywords: [lead quality, loan quality, good leads, bad leads, medium, quality score]

  - name: loan_by_lender
    label: "Loans by Lender / Provider"
    description: "Lead or offer count broken down by lender: kissht, pfl, moneyview, smfg, stashfin, herofincorp"
    tables: [leadorderinfo, loanoffers]
    keywords: [lender, provider, kissht, pfl, moneyview, smfg, stashfin, herofincorp, lender performance, by lender]

  - name: loan_conversion
    label: "Loan Lead Conversion"
    description: "Conversion rate from lead creation through funnel stages to disbursement"
    tables: [leadorderinfo]
    keywords: [conversion, conversion rate, lead conversion, how many converted, funnel conversion, drop off, dropout]

  - name: loan_offers_comparison
    label: "Loan Offers Comparison"
    description: "Compare lender offers by ROI, EMI, loan amount, processing fee and rejection rate"
    tables: [loanoffers]
    keywords: [loan offer, roi, interest rate, emi, processing fee, offer comparison, best offer, lowest rate, lender comparison]

  - name: loan_rejection
    label: "Loan Rejection Analysis"
    description: "Rejection reasons and rejection rates by lender or applicant attributes"
    tables: [loanoffers, leadorderinfo]
    keywords: [rejection, rejected, reject, grid reject, api reject, rejection rate, why rejected, loan declined]

  - name: loan_partner_performance
    label: "Partner Loan Performance"
    description: "Number of loan leads or offers generated by each Turtlemint partner"
    tables: [leadorderinfo]
    keywords: [partner loan, partner performance, loan by partner, which partner, partner id, partner name loan]

  - name: credit_score_analysis
    label: "Credit Score Analysis"
    description: "Average credit score, distribution, or % of applicants with available credit score"
    tables: [leadorderinfo]
    keywords: [credit score, cibil, crif, credit check, score, creditworthy, credit available]

  - name: loan_customer_demographics
    label: "Loan Customer Demographics"
    description: "Loan applicant breakdown by city, gender, employment type, income"
    tables: [leadorderinfo]
    keywords: [loan customer, applicant, employment type, salaried, self-employed, income, city loan, gender loan]

  - name: loan_journey_type
    label: "Loan Journey Type"
    description: "Split of assisted (partner) vs direct (self-serve) loan journeys"
    tables: [leadorderinfo]
    keywords: [journey type, assisted, direct, self-serve, partner assisted, journey]


dimensions:

  - name: product_type
    label: "Product Type"
    table: policy
    column: product_type
    values: [Motor, Health, Life, Travel]
    keywords: [motor, health, life, travel, product type, product]

  - name: partner_tier
    label: "Partner Tier"
    table: partner
    column: tier
    values: [Silver, Gold, Platinum]
    keywords: [tier, silver, gold, platinum, partner level, partner category]

  - name: claim_status
    label: "Claim Status"
    table: claim
    column: status
    values: [Pending, Settled, Rejected]
    keywords: [pending, settled, rejected, claim status, settlement]

  - name: state
    label: "State"
    table: policydetail
    column: state
    keywords: [state, region, location, geography, city]

  - name: policy_status
    label: "Policy Status"
    table: policy
    column: status
    values: [active, lapsed, cancelled]
    keywords: [active policy, lapsed policy, cancelled, policy status]


business_terms:

  - term: "lapsed policy"
    definition: "A policy where status = 'lapsed' (expired without renewal)"
    sql_filter: "status = 'lapsed'"
    table: policy
    keywords: [lapsed, lapse, not renewed, expired policy]

  - term: "pending settlement"
    definition: "A claim where status = 'Pending' (not yet resolved)"
    sql_filter: "status = 'Pending'"
    table: claim
    keywords: [pending, unsettled, pending settlement, outstanding claims]

  - term: "active policy"
    definition: "A policy where status = 'active'"
    sql_filter: "status = 'active'"
    table: policy
    keywords: [active, live policy, current policy, in-force]

  - term: "last month"
    definition: "The calendar month immediately before the current month"
    sql_filter: "toStartOfMonth(created_at) = toStartOfMonth(now() - INTERVAL 1 MONTH)"
    keywords: [last month, previous month, prior month]

  - term: "this year"
    definition: "The current calendar year (year-to-date)"
    sql_filter: "toYear(created_at) = toYear(now())"
    keywords: [this year, current year, ytd, year to date]

  - term: "this month"
    definition: "The current calendar month"
    sql_filter: "toStartOfMonth(created_at) = toStartOfMonth(now())"
    keywords: [this month, current month]

  # ── Real policydetail business terms ─────────────────────────────────────

  - term: "in force"
    definition: "A policy that is currently active and paying — substatus = 'IN_FORCE'"
    sql_filter: "substatus = 'IN_FORCE'"
    table: policydetail
    keywords: [in force, inforce, active policy, live policy]

  - term: "lapsed policy (real)"
    definition: "A policy in the real data where substatus = 'LAPSED'"
    sql_filter: "substatus = 'LAPSED'"
    table: policydetail
    keywords: [lapsed, lapse, not renewed]

  - term: "new business"
    definition: "Policies where businesstype = 'NEW' (not renewals)"
    sql_filter: "businesstype = 'NEW'"
    table: policydetail
    keywords: [new business, fresh policy, new policy]

  - term: "renewal"
    definition: "Policies where businesstype = 'RENEWAL'"
    sql_filter: "businesstype = 'RENEWAL'"
    table: policydetail
    keywords: [renewal, renewed, renewing]

  # ── Sachet lending business terms ─────────────────────────────────────────

  - term: "loan lead at quote stage"
    definition: "A loan lead that has reached the quote/offer display stage (leadstage = 'quote')"
    sql_filter: "leadstage = 'quote'"
    table: leadorderinfo
    keywords: [quote stage, quote, at quote, reached quote]

  - term: "converted loan lead"
    definition: "A loan lead that reached the payment or issuance stage — considered a conversion"
    sql_filter: "leadstage IN ('payment', 'issuance')"
    table: leadorderinfo
    keywords: [converted, conversion, loan converted, successful lead, reached payment]

  - term: "closed lead"
    definition: "A loan lead with leadstatus = 'closed' (no longer active)"
    sql_filter: "leadstatus = 'closed'"
    table: leadorderinfo
    keywords: [closed lead, closed, inactive lead, lead closed]

  - term: "good quality lead"
    definition: "A lead with leadquality = 'GOOD'"
    sql_filter: "leadquality = 'GOOD'"
    table: leadorderinfo
    keywords: [good lead, quality lead, good quality]

  - term: "successful loan offer"
    definition: "A lender offer where offer_status = 'success' (offer was made to applicant)"
    sql_filter: "offer_status = 'success'"
    table: loanoffers
    keywords: [successful offer, offer success, approved offer, offer received]

  - term: "rejected loan offer"
    definition: "A lender offer where offer_status = 'reject' (lender declined the applicant)"
    sql_filter: "offer_status = 'reject'"
    table: loanoffers
    keywords: [rejected offer, offer rejected, declined offer, loan reject]

  - term: "personal loan"
    definition: "A personal-loan product lead — productcode = 'personal-loan'"
    sql_filter: "productcode = 'personal-loan'"
    table: leadorderinfo
    keywords: [personal loan, personal-loan, pl, unsecured loan]

  - term: "assisted journey"
    definition: "Loan journey initiated through a partner (journey_journeytype = 'assisted')"
    sql_filter: "journey_journeytype = 'assisted'"
    table: leadorderinfo
    keywords: [assisted, partner assisted, partner journey]

  - term: "life vertical"
    definition: "Life insurance policies — vertical = 'LIFE'"
    sql_filter: "vertical = 'LIFE'"
    table: policydetail
    keywords: [life, life insurance, life vertical, life policies]

  - term: "gross premium"
    definition: "premiumdetails_grosspremium — the full premium including GST"
    sql_filter: "premiumdetails_grosspremium"
    table: policydetail
    keywords: [gross premium, gwp, total premium]

  - term: "person / name lookup"
    definition: "Names are stored in MULTIPLE columns in policydetail — choose the right one: (1) Partner / agent / DP / intermediary: use salesdetail_intermediaryname (stores full name as one string, e.g. 'mahjabin khatun'). (2) Customer / proposer / insured: use proposer_fname AND proposer_lname (split into two columns). (3) Area Manager: salesdetail_am. (4) RM / Relationship Manager: salesdetail_rm. (5) SM: salesdetail_sm. When the person's role is unknown, search ALL name columns with OR: lower(salesdetail_intermediaryname) ILIKE '%name%' OR lower(proposer_fname) ILIKE '%name%'."
    table: policydetail
    keywords: [client, customer name, insured, proposer, policy holder, name, person, partner name, agent, intermediary, give details, details of]


example_questions:

  - question: "How many partners signed up last month?"
    tables: [partner]
    sql: >
      SELECT count() AS partner_count
      FROM turtlemint.partner
      WHERE toStartOfMonth(joined_at) = toStartOfMonth(now() - INTERVAL 1 MONTH)

  - question: "Total premium by product type"
    tables: [policy]
    sql: >
      SELECT product_type, sum(premium) AS total_premium
      FROM turtlemint.policy
      GROUP BY product_type
      ORDER BY total_premium DESC

  - question: "Top 5 partners by number of policies sold"
    tables: [partner, policy]
    sql: >
      SELECT p.name, count() AS policies_sold
      FROM turtlemint.policy pol
      JOIN turtlemint.partner p ON pol.partner_id = p.partner_id
      GROUP BY p.name
      ORDER BY policies_sold DESC
      LIMIT 5

  - question: "Which state has the highest health premium?"
    tables: [policy, customer]
    sql: >
      SELECT c.state, sum(pol.premium) AS health_premium
      FROM turtlemint.policy pol
      JOIN turtlemint.customer c ON pol.customer_id = c.customer_id
      WHERE pol.product_type = 'Health'
      GROUP BY c.state
      ORDER BY health_premium DESC
      LIMIT 1

  - question: "How many claims are still pending settlement?"
    tables: [claim]
    sql: >
      SELECT count() AS pending_claims
      FROM turtlemint.claim
      WHERE status = 'Pending'

  - question: "Average commission per partner tier"
    tables: [commission, partner]
    sql: >
      SELECT p.tier, avg(c.amount) AS avg_commission
      FROM turtlemint.commission c
      JOIN turtlemint.partner p ON c.partner_id = p.partner_id
      GROUP BY p.tier
      ORDER BY avg_commission DESC

  # ── Real policydetail example queries ────────────────────────────────────

  - question: "Total gross premium by insurer"
    tables: [policydetail]
    sql: >
      SELECT insurer, sum(premiumdetails_grosspremium) AS total_gross_premium
      FROM spectrum.policydetail
      GROUP BY insurer
      ORDER BY total_gross_premium DESC

  - question: "How many policies are in force?"
    tables: [policydetail]
    sql: >
      SELECT count() AS inforce_policies
      FROM spectrum.policydetail
      WHERE substatus = 'IN_FORCE'

  - question: "Policy count by region"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_region, count() AS policy_count
      FROM spectrum.policydetail
      GROUP BY salesdetail_region
      ORDER BY policy_count DESC

  - question: "Top 5 partners by gross premium"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_intermediaryname,
             salesdetail_intermediaryinternalid,
             count() AS policy_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      GROUP BY salesdetail_intermediaryname, salesdetail_intermediaryinternalid
      ORDER BY total_premium DESC
      LIMIT 5

  - question: "New business vs renewal split"
    tables: [policydetail]
    sql: >
      SELECT businesstype, count() AS policy_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      GROUP BY businesstype

  - question: "Give details of client Mahjabin Khatun"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_intermediaryname, salesdetail_intermediaryinternalid,
             salesdetail_region, salesdetail_am, salesdetail_rm,
             insurer, vertical, businesstype, substatus,
             premiumdetails_grosspremium, policynumber, startdate, enddate
      FROM spectrum.policydetail
      WHERE lower(salesdetail_intermediaryname) ILIKE '%mahjabin khatun%'
      LIMIT 1000

  - question: "Show all policies sold by partner Mahjabin Khatun"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_intermediaryname, salesdetail_intermediaryinternalid,
             insurer, vertical, businesstype, substatus,
             premiumdetails_grosspremium, policynumber, customerid,
             startdate, enddate
      FROM spectrum.policydetail
      WHERE lower(salesdetail_intermediaryname) ILIKE '%mahjabin khatun%'
      LIMIT 1000

  - question: "Give details of customer Utkarsh Singh"
    tables: [policydetail]
    sql: >
      SELECT customerid, proposer_fname, proposer_lname,
             insurer, vertical, businesstype, substatus,
             premiumdetails_grosspremium, policynumber, startdate, enddate
      FROM spectrum.policydetail
      WHERE lower(proposer_fname) ILIKE '%utkarsh%'
        AND lower(proposer_lname) ILIKE '%singh%'
      LIMIT 1000

  - question: "Show all policies for customer ID C12345"
    tables: [policydetail]
    sql: >
      SELECT customerid, proposer_fname, proposer_lname, insurer,
             vertical, businesstype, substatus, premiumdetails_grosspremium,
             startdate, enddate
      FROM spectrum.policydetail
      WHERE customerid = 'C12345'
      LIMIT 1000

  # ── Sachet lending (leadorderinfo / loanoffers) ───────────────────────────

  - question: "How many loan leads were created last month?"
    tables: [leadorderinfo]
    sql: >
      SELECT count(*) AS lead_count
      FROM sachet.leadorderinfo
      WHERE toStartOfMonth(createdat) = toStartOfMonth(now() - INTERVAL 1 MONTH)

  - question: "Loan lead funnel — how many leads at each stage?"
    tables: [leadorderinfo]
    sql: >
      SELECT leadstage, count(*) AS lead_count
      FROM sachet.leadorderinfo
      GROUP BY leadstage
      ORDER BY lead_count DESC

  - question: "Which lender has the most loan leads?"
    tables: [leadorderinfo]
    sql: >
      SELECT provider, count(*) AS lead_count
      FROM sachet.leadorderinfo
      GROUP BY provider
      ORDER BY lead_count DESC

  - question: "What is the lead quality breakdown for personal loans?"
    tables: [leadorderinfo]
    sql: >
      SELECT leadquality, count(*) AS lead_count
      FROM sachet.leadorderinfo
      WHERE productcode = 'personal-loan'
      GROUP BY leadquality
      ORDER BY lead_count DESC

  - question: "Top 5 partners by number of loan leads"
    tables: [leadorderinfo]
    sql: >
      SELECT partnername, count(*) AS lead_count
      FROM sachet.leadorderinfo
      GROUP BY partnername
      ORDER BY lead_count DESC
      LIMIT 5

  - question: "What is the conversion rate from quote to payment stage?"
    tables: [leadorderinfo]
    sql: >
      SELECT
        countIf(leadstage = 'quote') AS quote_leads,
        countIf(leadstage = 'payment') AS payment_leads,
        round(100.0 * countIf(leadstage = 'payment') / nullIf(countIf(leadstage = 'quote'), 0), 2) AS conversion_pct
      FROM sachet.leadorderinfo

  - question: "Show loan offers comparison — ROI and EMI by lender"
    tables: [loanoffers]
    sql: >
      SELECT offer_provider,
             round(avg(offer_roi), 2) AS avg_roi,
             round(avg(offer_emi), 2) AS avg_emi,
             round(avg(offer_loanamount), 0) AS avg_loan_amount,
             count(*) AS offer_count
      FROM sachet.loanoffers
      WHERE offer_status = 'success'
      GROUP BY offer_provider
      ORDER BY avg_roi ASC

  - question: "Which lenders have the highest rejection rate?"
    tables: [loanoffers]
    sql: >
      SELECT offer_provider,
             count(*) AS total_offers,
             countIf(offer_status = 'reject') AS rejected,
             round(100.0 * countIf(offer_status = 'reject') / count(*), 2) AS rejection_pct
      FROM sachet.loanoffers
      GROUP BY offer_provider
      ORDER BY rejection_pct DESC

  - question: "Average credit score of loan applicants"
    tables: [leadorderinfo]
    sql: >
      SELECT round(avg(toFloat64OrNull(leadcustomerinfo_creditscore)), 0) AS avg_credit_score,
             count(*) AS total_leads,
             countIf(leadcustomerinfo_creditscoreavailable = 'True') AS credit_score_available
      FROM sachet.leadorderinfo
      WHERE leadcustomerinfo_creditscore != 'NA'
        AND leadcustomerinfo_creditscore != '0'

  - question: "Loan leads by employment type"
    tables: [leadorderinfo]
    sql: >
      SELECT leadcustomerinfo_employmenttype, count(*) AS lead_count
      FROM sachet.leadorderinfo
      GROUP BY leadcustomerinfo_employmenttype
      ORDER BY lead_count DESC
