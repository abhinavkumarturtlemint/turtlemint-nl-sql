             productcode, createdat
      FROM sachet.leadorderinfo
      WHERE lower(leadcustomerinfo_customername) ILIKE '%abhishek kumar%'
      LIMIT 100

  # ── Additional policydetail examples ─────────────────────────────────────

  - question: "Policies breakdown by sales channel (BQP, partner, direct)"
    tables: [policydetail]
    sql: >
      SELECT channeltype,
             count() AS policy_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      GROUP BY channeltype
      ORDER BY policy_count DESC

  - question: "How many ULIP policies were sold this year?"
    tables: [policydetail]
    sql: >
      SELECT count() AS ulip_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      WHERE plantype = 'ulip'
        AND toYear(createdat) = toYear(now())

  - question: "Which RM has the highest gross premium this year?"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_rm,
             count() AS policy_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      WHERE toYear(createdat) = toYear(now())
        AND salesdetail_rm != ''
      GROUP BY salesdetail_rm
      ORDER BY total_premium DESC
      LIMIT 10

  - question: "Top 10 area managers by number of policies"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_am,
             count() AS policy_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      WHERE salesdetail_am != ''
      GROUP BY salesdetail_am
      ORDER BY policy_count DESC
      LIMIT 10

  - question: "Policies expiring in the next 30 days"
    tables: [policydetail]
    sql: >
      SELECT policynumber, customerid, proposer_fname, proposer_lname,
             insurer, vertical, enddate,
             salesdetail_intermediaryname, salesdetail_region,
             premiumdetails_grosspremium
      FROM spectrum.policydetail
      WHERE enddate >= today()
        AND enddate <= today() + INTERVAL 30 DAY
        AND substatus = 'IN_FORCE'
      ORDER BY enddate ASC
      LIMIT 100

  - question: "Annualised net premium by insurer"
    tables: [policydetail]
    sql: >
      SELECT insurer,
             count() AS policy_count,
             sum(premiumdetails_annualisednetpremium) AS total_annp,
             round(avg(premiumdetails_annualisednetpremium), 0) AS avg_annp
      FROM spectrum.policydetail
      WHERE premiumdetails_annualisednetpremium > 0
      GROUP BY insurer
      ORDER BY total_annp DESC

  - question: "Premium breakdown by payment frequency"
    tables: [policydetail]
    sql: >
      SELECT payment_paymentfrequency,
             count() AS policy_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      GROUP BY payment_paymentfrequency
      ORDER BY policy_count DESC

  - question: "How many rollover policies do we have by insurer?"
    tables: [policydetail]
    sql: >
      SELECT insurer, count() AS rollover_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      WHERE businesstype = 'ROLLOVER'
      GROUP BY insurer
      ORDER BY rollover_count DESC

  - question: "Policies with overdue payments by region"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_region,
             count() AS overdue_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      WHERE payment_paymentstatus = 'Overdue'
      GROUP BY salesdetail_region
      ORDER BY overdue_count DESC

  - question: "Sum insured breakdown by vertical"
    tables: [policydetail]
    sql: >
      SELECT vertical,
             count() AS policy_count,
             sum(policyrisk_suminsured) AS total_sum_insured,
             round(avg(policyrisk_suminsured), 0) AS avg_sum_insured
      FROM spectrum.policydetail
      WHERE policyrisk_suminsured > 0
      GROUP BY vertical
      ORDER BY total_sum_insured DESC

  # ── Additional Sachet lending examples ───────────────────────────────────

  - question: "What is the average loan amount requested by employment type?"
    tables: [leadorderinfo]
    sql: >
      SELECT leadcustomerinfo_employmenttype,
             count(*) AS applicant_count,
             round(avg(toFloat64OrNull(leadcustomerinfo_loanamount)), 0) AS avg_loan_amount,
             round(avg(toFloat64OrNull(leadcustomerinfo_monthlyincome)), 0) AS avg_monthly_income
      FROM sachet.leadorderinfo
      WHERE leadcustomerinfo_loanamount IS NOT NULL
        AND leadcustomerinfo_loanamount != '0'
      GROUP BY leadcustomerinfo_employmenttype
      ORDER BY avg_loan_amount DESC

  - question: "Loan leads by city — which cities have the most applicants?"
    tables: [leadorderinfo]
    sql: >
      SELECT leadcustomerinfo_city, count(*) AS lead_count
      FROM sachet.leadorderinfo
      WHERE leadcustomerinfo_city IS NOT NULL
        AND leadcustomerinfo_city != ''
      GROUP BY leadcustomerinfo_city
      ORDER BY lead_count DESC
      LIMIT 20

  - question: "What is the success rate of loan offers by lender?"
    tables: [loanoffers]
    sql: >
      SELECT offer_provider,
             count(*) AS total_offers,
             countIf(offer_status = 'success') AS successful_offers,
             countIf(offer_status = 'reject') AS rejected_offers,
             round(100.0 * countIf(offer_status = 'success') / count(*), 2) AS success_rate_pct
      FROM sachet.loanoffers
      GROUP BY offer_provider
      ORDER BY success_rate_pct DESC

  - question: "How many leads dropped before receiving any offer (pre-offer drop-off)?"
    tables: [leadorderinfo]
    sql: >
      SELECT count(*) AS preoffer_dropoff_count,
             round(100.0 * count(*) / (SELECT count(*) FROM sachet.leadorderinfo), 2) AS pct_of_total
      FROM sachet.leadorderinfo
      WHERE leadstage = 'Preoffer drop-off'

  - question: "Processing fee comparison across lenders"
    tables: [loanoffers]
    sql: >
      SELECT offer_provider,
             round(avg(toFloat64OrNull(offer_processingfee)), 0) AS avg_processing_fee,
             round(min(toFloat64OrNull(offer_processingfee)), 0) AS min_fee,
             round(max(toFloat64OrNull(offer_processingfee)), 0) AS max_fee,
             count(*) AS offer_count
      FROM sachet.loanoffers
      WHERE offer_status = 'success'
        AND offer_processingfee IS NOT NULL
      GROUP BY offer_provider
      ORDER BY avg_processing_fee ASC

  - question: "Grid rejection vs API rejection breakdown by lender"
    tables: [loanoffers]
    sql: >
      SELECT offer_provider,
             count(*) AS total_rejected,
             countIf(offer_isgridreject = 'True') AS grid_rejections,
             countIf(offer_isapiReject = 'True') AS api_rejections,
             round(100.0 * countIf(offer_isgridreject = 'True') / count(*), 2) AS grid_reject_pct
      FROM sachet.loanoffers
      WHERE offer_status = 'reject'
      GROUP BY offer_provider
      ORDER BY total_rejected DESC

  - question: "Assisted vs direct journey split for loan leads"
    tables: [leadorderinfo]
    sql: >
      SELECT journey_journeytype,
             count(*) AS lead_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 2) AS pct
      FROM sachet.leadorderinfo
      WHERE journey_journeytype IS NOT NULL
        AND journey_journeytype != ''
      GROUP BY journey_journeytype
      ORDER BY lead_count DESC

  - question: "Loan leads breakdown by product code"
    tables: [leadorderinfo]
    sql: >
      SELECT productcode,
             count(*) AS lead_count,
             round(avg(toFloat64OrNull(leadcustomerinfo_loanamount)), 0) AS avg_loan_amount
      FROM sachet.leadorderinfo
      WHERE productcode IS NOT NULL
        AND productcode != ''
      GROUP BY productcode
      ORDER BY lead_count DESC

  # ── New metric examples: CRIF, rejection, user quality, route, broker ─────

  - question: "What is the average credit utilization of loan applicants?"
    tables: [leadorderinfo]
    sql: >
      SELECT
        round(avg(toFloat64OrNull(leadcustomerinfo_creditinfocrif_totalcreditutilized)), 0) AS avg_credit_utilized,
        round(avg(toFloat64OrNull(leadcustomerinfo_creditinfocrif_totalcreditlimit)), 0) AS avg_credit_limit,
        round(100.0 * avg(toFloat64OrNull(leadcustomerinfo_creditinfocrif_totalcreditutilized))
              / nullIf(avg(toFloat64OrNull(leadcustomerinfo_creditinfocrif_totalcreditlimit)), 0), 2) AS utilization_pct,
        round(avg(toFloat64OrNull(leadcustomerinfo_creditinfocrif_uniquecreditaccounts)), 1) AS avg_unique_accounts
      FROM sachet.leadorderinfo
      WHERE leadcustomerinfo_creditinfocrif_totalcreditlimit IS NOT NULL
        AND leadcustomerinfo_creditinfocrif_totalcreditlimit != '0'

  - question: "What are the top reasons loan leads are rejected?"
    tables: [leadorderinfo]
    sql: >
      SELECT leadextrainfo_additionaldetails_rejectionreason AS rejection_reason,
             count(*) AS lead_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 2) AS pct
      FROM sachet.leadorderinfo
      WHERE leadextrainfo_additionaldetails_rejectionreason IS NOT NULL
        AND leadextrainfo_additionaldetails_rejectionreason != ''
      GROUP BY rejection_reason
      ORDER BY lead_count DESC

  - question: "Breakdown of leads by user quality segment (Prime, Sub_Prime, REJECTS)"
    tables: [leadorderinfo]
    sql: >
      SELECT leadextrainfo_additionaldetails_userquality AS user_quality,
             count(*) AS lead_count,
             round(100.0 * count(*) / sum(count(*)) OVER (), 2) AS pct
      FROM sachet.leadorderinfo
      WHERE leadextrainfo_additionaldetails_userquality IS NOT NULL
        AND leadextrainfo_additionaldetails_userquality != ''
      GROUP BY user_quality
      ORDER BY lead_count DESC

  - question: "How many applicants have a credit settlement, suit filed, or write-off on their bureau?"
    tables: [leadorderinfo]
    sql: >
      SELECT
        countIf(leadcustomerinfo_creditinfocrif_hassettlement = 'True') AS has_settlement,
        countIf(leadcustomerinfo_creditinfocrif_hassuitfilled = 'True') AS has_suit_filed,
        countIf(leadcustomerinfo_creditinfocrif_haswriteoff = 'True') AS has_writeoff,
        countIf(leadcustomerinfo_creditinfocrif_hassettlement = 'True'
                OR leadcustomerinfo_creditinfocrif_hassuitfilled = 'True'
                OR leadcustomerinfo_creditinfocrif_haswriteoff = 'True') AS any_adverse_flag,
        count(*) AS total_with_bureau_data
      FROM sachet.leadorderinfo
      WHERE leadcustomerinfo_creditinfocrif_creditscore IS NOT NULL
        AND leadcustomerinfo_creditinfocrif_creditscore != ''

  - question: "How many leads have a pre-approved loan amount and what is the average pre-approval value?"
    tables: [leadorderinfo]
    sql: >
      SELECT
        countIf(toFloat64OrNull(leadextrainfo_additionaldetails_preapprovedvalue) > 0) AS preapproved_leads,
        round(avg(toFloat64OrNull(leadextrainfo_additionaldetails_preapprovedvalue))
              FILTER (WHERE toFloat64OrNull(leadextrainfo_additionaldetails_preapprovedvalue) > 0), 0) AS avg_preapproved_value,
        count(*) AS total_leads
      FROM sachet.leadorderinfo

  - question: "What is the GRID vs IHUB offer split by lender?"
    tables: [loanoffers]
    sql: >
      SELECT offer_provider,
             countIf(offer_route = 'GRID') AS grid_offers,
             countIf(offer_route = 'IHUB') AS ihub_offers,
             count(*) AS total_offers,
             round(100.0 * countIf(offer_route = 'GRID') / count(*), 2) AS grid_pct
      FROM sachet.loanoffers
      WHERE offer_route IS NOT NULL
        AND offer_route != ''
      GROUP BY offer_provider
      ORDER BY total_offers DESC

  - question: "Loan lead volume by broker and tenant platform"
    tables: [leadorderinfo]
    sql: >
      SELECT broker,
             tenant,
             count(*) AS lead_count,
             round(avg(toFloat64OrNull(leadcustomerinfo_loanamount)), 0) AS avg_loan_amount
      FROM sachet.leadorderinfo
      WHERE broker IS NOT NULL
        AND broker != ''
      GROUP BY broker, tenant
      ORDER BY lead_count DESC
