business_terms:

  - term: "lapsed policy"
    definition: "A policy where status = 'lapsed' (expired without renewal)"
    sql_filter: "status = 'lapsed'"
    table: policy
    keywords: [lapsed, lapse, not renewed, expired policy]

  - term: "pending settlement"
    definition: "A claim where status = 'Pending' (not yet resolved)"
    sql_filter: "status = 'Pending'"
    table: claim
    keywords: [pending, unsettled, pending settlement, outstanding claims]

  - term: "active policy"
    definition: "A policy where status = 'active'"
    sql_filter: "status = 'active'"
    table: policy
    keywords: [active, live policy, current policy, in-force]

  - term: "last month"
    definition: "The calendar month immediately before the current month"
    sql_filter: "toStartOfMonth(created_at) = toStartOfMonth(now() - INTERVAL 1 MONTH)"
    keywords: [last month, previous month, prior month]

  - term: "this year"
    definition: "The current calendar year (year-to-date)"
    sql_filter: "toYear(created_at) = toYear(now())"
    keywords: [this year, current year, ytd, year to date]

  - term: "this month"
    definition: "The current calendar month"
    sql_filter: "toStartOfMonth(created_at) = toStartOfMonth(now())"
    keywords: [this month, current month]

  # ── Real policydetail business terms ─────────────────────────────────────

  - term: "in force"
    definition: "A policy that is currently active and paying — substatus = 'IN_FORCE'"
    sql_filter: "substatus = 'IN_FORCE'"
    table: policydetail
    keywords: [in force, inforce, active policy, live policy]

  - term: "lapsed policy (real)"
    definition: "A policy in the real data where substatus = 'LAPSED'"
    sql_filter: "substatus = 'LAPSED'"
    table: policydetail
    keywords: [lapsed, lapse, not renewed]

  - term: "new business"
    definition: "Policies where businesstype = 'NEW' (not renewals)"
    sql_filter: "businesstype = 'NEW'"
    table: policydetail
    keywords: [new business, fresh policy, new policy]

  - term: "renewal"
    definition: "Policies where businesstype = 'RENEWAL'"
    sql_filter: "businesstype = 'RENEWAL'"
    table: policydetail
    keywords: [renewal, renewed, renewing]

  - term: "rollover"
    definition: "Policies ported from another insurer — businesstype = 'ROLLOVER'"
