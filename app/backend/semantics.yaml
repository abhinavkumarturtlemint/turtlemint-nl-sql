example_questions:

  - question: "How many partners signed up last month?"
    tables: [partner]
    sql: >
      SELECT count() AS partner_count
      FROM turtlemint.partner
      WHERE toStartOfMonth(joined_at) = toStartOfMonth(now() - INTERVAL 1 MONTH)

  - question: "Total premium by product type"
    tables: [policy]
    sql: >
      SELECT product_type, sum(premium) AS total_premium
      FROM turtlemint.policy
      GROUP BY product_type
      ORDER BY total_premium DESC

  - question: "Top 5 partners by number of policies sold"
    tables: [partner, policy]
    sql: >
      SELECT p.name, count() AS policies_sold
      FROM turtlemint.policy pol
      JOIN turtlemint.partner p ON pol.partner_id = p.partner_id
      GROUP BY p.name
      ORDER BY policies_sold DESC
      LIMIT 5

  - question: "Which state has the highest health premium?"
    tables: [policy, customer]
    sql: >
      SELECT c.state, sum(pol.premium) AS health_premium
      FROM turtlemint.policy pol
      JOIN turtlemint.customer c ON pol.customer_id = c.customer_id
      WHERE pol.product_type = 'Health'
      GROUP BY c.state
      ORDER BY health_premium DESC
      LIMIT 1

  - question: "How many claims are still pending settlement?"
    tables: [claim]
    sql: >
      SELECT count() AS pending_claims
      FROM turtlemint.claim
      WHERE status = 'Pending'

  - question: "Average commission per partner tier"
    tables: [commission, partner]
    sql: >
      SELECT p.tier, avg(c.amount) AS avg_commission
      FROM turtlemint.commission c
      JOIN turtlemint.partner p ON c.partner_id = p.partner_id
      GROUP BY p.tier
      ORDER BY avg_commission DESC

  # ── Real policydetail example queries ────────────────────────────────────

  - question: "Total gross premium by insurer"
    tables: [policydetail]
    sql: >
      SELECT insurer, sum(premiumdetails_grosspremium) AS total_gross_premium
      FROM spectrum.policydetail
      GROUP BY insurer
      ORDER BY total_gross_premium DESC

  - question: "How many policies are in force?"
    tables: [policydetail]
    sql: >
      SELECT count() AS inforce_policies
      FROM spectrum.policydetail
      WHERE substatus = 'IN_FORCE'

  - question: "Policy count by region"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_region, count() AS policy_count
      FROM spectrum.policydetail
      GROUP BY salesdetail_region
      ORDER BY policy_count DESC

  - question: "Top 5 partners by gross premium"
    tables: [policydetail]
    sql: >
      SELECT salesdetail_intermediaryname,
             salesdetail_intermediaryinternalid,
             count() AS policy_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      GROUP BY salesdetail_intermediaryname, salesdetail_intermediaryinternalid
      ORDER BY total_premium DESC
      LIMIT 5

  - question: "New business vs renewal split"
    tables: [policydetail]
    sql: >
      SELECT businesstype, count() AS policy_count,
             sum(premiumdetails_grosspremium) AS total_premium
      FROM spectrum.policydetail
      GROUP BY businesstype

